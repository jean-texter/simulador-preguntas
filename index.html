<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Banco de Preguntas</title>
    <style>
        /* Estilos CSS integrados para mantener un solo archivo por ahora */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFD700; /* Fondo amarillo vibrante */
            color: #1A1A1A;            /* Texto oscuro para buen contraste */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;             /* Ocupa el 100% del alto de la pantalla */
            display: flex;             /* Activa Flexbox para centrar */
            justify-content: center;   /* Centra horizontalmente */
            align-items: center;       /* Centra verticalmente */
            text-align: center;
            padding: 20px;
        }

        .contenedor {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Simulador de Banco de Preguntas</h1>
        <p>¡LOVE YOU MEY!</p>
    </div>

</body>
</html>
